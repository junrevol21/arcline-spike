name: Spike build (iOS IPA + Android APK)

# Membangun aplikasi uji GPS background di cloud.
# iOS: IPA tanpa tanda tangan, dipasang lewat Sideloadly/AltStore (Apple ID gratis).
# Android: APK untuk dipasang langsung.
# Jalankan manual: tab Actions > "Spike build" > Run workflow.
on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: spike/gps_bg
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

      - name: Build iOS tanpa codesign
        run: flutter build ios --release --no-codesign

      - name: Bungkus jadi IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry arcline-spike.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: arcline-spike-ipa
          path: spike/gps_bg/arcline-spike.ipa
          retention-days: 14

  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spike/gps_bg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - run: flutter build apk --release

      - run: flutter build apk --release --split-per-abi --target-platform android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: arcline-spike-apk
          path: |
            spike/gps_bg/build/app/outputs/flutter-apk/app-release.apk
            spike/gps_bg/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 14
